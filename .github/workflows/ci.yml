name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm audit --omit=dev

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker compose -f docker/compose.yml up --build -d
      - name: Wait for the complete stack
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker/compose.yml ps
          exit 1
      - name: Run HTTP acceptance scenario
        env:
          RUN_INTEGRATION: "1"
        run: pytest backend/tests/test_acceptance_http.py
      - name: Run browser acceptance scenario
        run: npm --prefix frontend run test:e2e
      - name: Show container logs
        if: failure()
        run: docker compose -f docker/compose.yml logs
      - name: Stop stack
        if: always()
        run: docker compose -f docker/compose.yml down -v
