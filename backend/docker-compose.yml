name: tv-poll

services:
  postgres:
    image: postgres:16
    pull_policy: missing
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll -d poll"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    pull_policy: missing
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://poll:poll@postgres:5432/poll
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: dev-admin-token
      IP_HASH_SALT: dev-salt
      COUNTER_SHARDS: "1"
      VOTE_ASYNC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
